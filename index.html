<!DOCTYPE html>
<html>
    <head>
        <link rel="shortcut icon" href="images/icon.jpg" type="image/x-icon">
        <link rel="stylesheet" href="style/home.css">
        
<style>
    .rm-slider { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 12px; }
    .slides { display: flex; width: 500%; animation: slide 20s infinite; }
    .slides img { width: 20%; height: 100%; object-fit: cover; }
    .overlay {
      position: absolute; bottom: 0; width: 100%;
      background: linear-gradient(transparent, rgba(10,25,47,0.95));
      color: white; padding: 30px; text-align: center;
    }
    @keyframes slide {
      0%,20% { transform: translateX(0); }
      25%,45% { transform: translateX(-20%); }
      50%,70% { transform: translateX(-40%); }
      75%,90% { transform: translateX(-60%); }
      95%,100% { transform: translateX(-80%); }
    }
    </style>
    </head>
    <body>
        <div class="top">
            <div id="top">
                <img src="images/icon.jpg" width="100px"/>
                <h1>Rebotile Mokoto</h1>
                <Nav>
                    <a href="pages/about/">About</a>
                    <a href="pages/skills/">Projects</a>
                    <a href="pages/service/">Service</a>
                    <a href="pages/contact/">Contact</a>
                    <img id="menub" src="images/menu.png" alt="menu" width="30px">
                </Nav>
            </div>
        </div>
        
          
        <div class="cont">
            

            <div id="cont">
                <fieldset><div class="rm-slider">
                    <div class="slides">
                      <img src="images/1.jpg" alt="Software Development - Frontend">
                      <img src="images/2.jpg" alt="Software Development - Backend">
                      <img src="images/3.jpg" alt="Electronics & Embedded">
                      <img src="images/4.jpg" alt="Desktop Applications">
                      <img src="images/5.jpg" alt="Games Programming">
                    </div>
                    <div class="overlay">
                      <h5>Rebotile Mokoto</h5>
                      <p>Software Development • Electronics • Games • Desktop Apps • Automation</p>
                    </div>
                  </div>
                </fieldset>
            </div>
        </div>
        <div class="foot">
            <div id="foot">
                <h3>&copy;Copyright reserved by RTA Mokoto</h3>
            </div>
        </div>

    </body>
</html>

<script>
    // Auto slide + pause on hover
    const slider = document.querySelector('.slides');
    slider.addEventListener('mouseenter', () => slider.style.animationPlayState = 'paused');
    slider.addEventListener('mouseleave', () => slider.style.animationPlayState = 'running');
    </script>
